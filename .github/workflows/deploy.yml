name: Deploy

# Branch → environment mapping (EI-OTA-ARCH-001 Phase 1.5):
#   main → production Worker `saigonliving`     (public landing page)
#   dev  → UAT/preview Worker `saigonliving-dev` (binds CDP_CORE → everyinn-cdp-core-dev)
#
# NOTE: the production Worker does not yet have a CDP_CORE service binding, so the loyalty
# lookup section must stay behind the cutover (see EI_PHASE1_STATUS.md P-3 / D-02).
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID  - 0dad5ab0e9e79d3ea14398430239723b
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (OpenNext → Workers)
        run: npx opennextjs-cloudflare build

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env=""

      - name: Deploy to UAT/preview
        if: github.ref == 'refs/heads/dev'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev

